services:
  web:
    build: .
    container_name: mantstock-web
    ports:
      - "8080:80"
    volumes:
      - ./uploads:/var/www/html/uploads
    environment:
      - DB_HOST=db  # <--- Usamos el nombre del servicio
      - DB_USER=mantuser
      - DB_PASSWORD=mantpass123
      - DB_NAME=MantStock
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mantstock-network
    restart: always  # <--- Se reinicia si falla

  db:
    image: mysql:8.0
    container_name: mantstock-db
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: MantStock
      MYSQL_USER: mantuser
      MYSQL_PASSWORD: mantpass123
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./DataBase:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - mantstock-network

networks:
  mantstock-network:
    driver: bridge

volumes:
  db_data: