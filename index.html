<!DOCTYPE html>
<html lang="es">

<head>
    <!-- ========= METADATOS BÁSICOS ========= -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Mantenimiento</title>

    <!-- ========= RECURSOS VISUALES Y ESTILOS ========= -->
    <link rel="icon" href="Interfaces/RecursosVisuales/Favicon/Favicon.png" type="image/png">
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="Style/login.css">

    <script src="assets/sweetalert2/sweetalert2.all.min.js"></script>
    <script src="FuncionesJS/FuncionesCarga/Crg-login.js"></script>
    <script src="FuncionesJS/FuncionesLogicas/AjaxCerrarSesion.js"></script>
    <script src="FuncionesJS/FuncionesLogicas/CrearAjax.js"></script>
    <script src="FuncionesJS/FuncionLogin/AjaxLogin.js"></script>
    <script src="FuncionesJS/FuncionesLogicas/filtrarCampos.js"></script>
    <script src="FuncionesJS/FuncionesLogicas/LimpiarCampos.js"></script>
</head>

<body>
    <!-- ========= VIDEO DE FONDO ========= -->
    <video class="video-bg" autoplay muted loop playsinline>
        <source src="Interfaces/RecursosVisuales/Otros/Fondo.mp4" type="video/mp4"> Tu navegador no soporta la
        reproducción de video.
    </video>

    <!-- ========= CONTENEDOR PRINCIPAL ========= -->
    <div class="d-flex justify-content-center align-items-center min-vh-100 login-container">

        <!-- ========= TARJETA DE LOGIN ========= -->
        <div class="card shadow-lg p-4 w-100" style="max-width: 400px;">

            <!-- ========= ENCABEZADO ========= -->
            <div class="text-center mb-4">
                <img src="Interfaces/RecursosVisuales/Logos/sasLogo.png" alt="Logo Jungle" class="img-fluid logo"
                    style="max-width: 220px;">
                <h5 class="mt-3 fw-bold">¡Bienvenid@!</h5>
                <p class="text-muted">Inicia sesión para continuar</p>
            </div>

            <!-- ========= FORMULARIO DE LOGIN ========= -->
            <form method="POST" class=" mb-4" autocomplete="off">

                <!-- Campo de Usuario -->
                <div class="mb-3">
                    <label for="txt_correo" class="form-label">Usuario</label>
                    <input type="text"
                        class="form-control bg-white bg-opacity-50 border border-dark border-opacity-25 text-dark"
                        id="txt_correo" placeholder="Ingresa tu usuario" required>
                </div>

                <!-- Campo de Contraseña -->
                <div class="mb-3">
                    <label for="txt_contrasena" class="form-label">Contraseña</label>
                    <input type="password"
                        class="form-control bg-white bg-opacity-50 border border-dark border-opacity-25 text-dark"
                        id="txt_contrasena" placeholder="Ingresa tu contraseña" required>
                </div>

                <!-- Botón de Iniciar Sesión -->
                <div class="d-grid mt-4">
                    <button type="button" id="btn_login" class="btn btn-dark">Iniciar Sesión</button>
                </div>

            </form>
        </div>
    </div>

    <!-- ========= SCRIPTS ========= -->
    <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>

</html>
