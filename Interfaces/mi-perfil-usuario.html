                    <!-- Perfil -->

    <div class="container py-4">
        <!-- FORMULARIO GENERAL -->
        <form id="form-perfil-usuario" autocomplete="off" novalidate>
            <!-- ENCABEZADO -->
            <div class="position-relative mb-5">
                <div class="position-absolute top-0 start-0">
                    <button class="btn btn-link text-dark p-0" onclick="history.back()" title="Volver">
                        <i class="bi bi-arrow-left-circle-fill fs-3"></i>
                    </button>
                </div>
                <h2 class="text-center mb-1 fw-bold">Mi Perfil</h2>
            </div>
            <!-- CONTENEDOR GENERAL CON CARD -->
            <div class="card border-0 shadow-sm mb-4">

                <!-- TÍTULO: DATOS PERSONALES -->
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0"><i class="bi bi-person-lines-fill me-2"></i>Datos Personales</h5>
                </div>

                <!-- CUERPO: DATOS PERSONALES -->
                <div class="card-body">
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label" for="perfil_id">ID</label>
                            <input type="text" class="form-control fw-bold text-dark" id="perfil_id" readonly />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="perfil_nombre">Nombre</label>
                            <input type="text" class="form-control fw-bold text-dark" id="perfil_nombre" readonly />
                        </div>
                        <div class="col-md-4">
                            <label class="form-label" for="perfil_apellido">Apellido</label>
                            <input type="text" class="form-control fw-bold text-dark" id="perfil_apellido" readonly />
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label class="form-label" for="perfil_correo">Correo</label>
                            <input type="email" class="form-control fw-bold text-dark" id="perfil_correo" readonly />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" for="perfil_rol">Rol</label>
                            <input type="text" class="form-control fw-bold text-dark" id="perfil_rol" readonly />
                        </div>
                    </div>
                </div>

                <!-- TÍTULO: CAMBIAR CONTRASEÑA -->
                <div class="card-header bg-dark text-white mt-3">
                    <h5 class="mb-0"><i class="bi bi-shield-lock-fill me-2"></i>Cambiar Contraseña</h5>
                </div>

                <!-- CUERPO: CAMBIAR CONTRASEÑA -->
                <div class="card-body">
                    <div class="row align-items-end">
                        <!-- NUEVA CONTRASEÑA -->
                        <div class="col-md-5 mb-3">
                            <label class="form-label" for="nueva_contraseña">Nueva Contraseña</label>
                            <input type="password" class="form-control text-secondary" id="nueva_contraseña"
                                placeholder="••••••••" autocomplete="new-password"
                                onfocus="this.classList.remove('text-secondary'); this.classList.add('text-dark');"
                                onblur="if(!this.value) {this.classList.remove('text-dark'); this.classList.add('text-secondary');}" />
                        </div>

                        <!-- REPETIR CONTRASEÑA -->
                        <div class="col-md-5 mb-3">
                            <label class="form-label" for="repetir_contraseña">Repetir Contraseña</label>
                            <input type="password" class="form-control text-secondary" id="repetir_contraseña"
                                placeholder="••••••••" autocomplete="new-password"
                                onfocus="this.classList.remove('text-secondary'); this.classList.add('text-dark');"
                                onblur="if(!this.value) {this.classList.remove('text-dark'); this.classList.add('text-secondary');}" />
                        </div>

                        <!-- BOTÓN -->
                        <div class="col-md-2 mb-3 d-grid">
                            <input type="button" class="btn btn-primary" id="btn_actualizar_contraseña"
                                value="Actualizar" />
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <!-- PIE DE PÁGINA -->

            <p class="mb-0 small">Versión 1.0 | © 2025 Sistema de Inventario -MantStock</p>
